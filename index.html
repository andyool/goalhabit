<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Set SMART goals, track habits, and see your Focus Score, precision and patterns — with an AI Agent that keeps you locked in." />
    <title>GoalHabit — Discipline, goals & habits</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("pattrn-state-v1") || "{}").state?.profile?.theme;
        if (t === "light" || (t === "system" && !matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
